name: Security verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Scan the checked-out tree for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source=/repo --no-git --redact
      - name: Run permission, SSRF and path traversal regressions
        run: >-
          mvn -B -ntp
          -Dtest=AiPermissionHandlerScanTest,AnonymousAiManagementAccessTest,SafeHttpClientTest,FilePathTraversalTest,SandboxFileServiceTest
          test
      - name: Restore dependency-check data
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-v12-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dependency-check-v12-${{ runner.os }}-
      - name: Scan runtime dependencies
        id: dependency-check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          status=1
          for attempt in 1 2 3; do
            rm -f target/dependency-check-report.html target/dependency-check-report.json
            mvn -B -ntp org.owasp:dependency-check-maven:12.2.2:check \
              -DfailBuildOnCVSS=9 -DskipTestScope=true -Dformats=HTML,JSON \
              -DdataDirectory=${{ runner.temp }}/dependency-check-data \
              -DretireJsAnalyzerEnabled=false -DhostedSuppressionsEnabled=false
            status=$?
            if [[ -f target/dependency-check-report.json ]]; then
              exit "$status"
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency data update failed before report generation; retrying (${attempt}/3)."
              sleep 15
            fi
          done
          exit "$status"
      - name: Save dependency-check data
        if: always() && steps.dependency-check.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-v12-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-${{ github.sha }}
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce dependency vulnerability gate
        if: always() && steps.dependency-check.outcome == 'failure'
        run: exit 1
